    <style>
        /* Rule 1 & 8: Light Purple Background & White Space */
        body {
            background-color: #F3E5F5; /* Very light purple */
            font-family: 'Times New Roman', serif;
            margin: 0;
            padding: 40px 20px;
            color: #4A148C; /* Deep purple for text */
        }

        .main-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* Rule 2 & 6: Section Alignment */
        .section-container {
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        .section-header {
            font-size: 1.5rem;
            margin-bottom: 20px;
            padding-left: 10px;
            border-left: 5px solid #7B1FA2;
            text-transform: uppercase;
        }

        /* Rule 3 & 4: Consistent White Inner Boxes */
        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .chart-card {
            background-color: #FFFFFF; /* Pure white inner box */
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            min-width: 350px;
            max-width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); /* Soft shadow for "neatness" */
            transition: transform 0.2s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rule 7: Remove Noise */
        .chart-card:hover {
            transform: translateY(-5px);
        }

        /* Specific fix for Task 1 being "clumsy" - allows it to breathe */
        .task1-row .chart-card {
            min-width: 450px;
        }
    </style>
</head>
